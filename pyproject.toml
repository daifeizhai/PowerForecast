[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerforecast"
version = "0.2.0"
description = "Reproducible 15-minute facility active-power forecasting skeleton (CPU only)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
optional = ["matplotlib>=3.9,<4", "scikit-learn>=1.5,<2"]
# Stage 2 historical-power main model A (Chronos-2 + TiRex-2), CPU only.
foundation = [
    "torch>=2.4,<3",
    "chronos-forecasting>=2.3,<2.4",
    "tirex-2>=0.3,<0.4",
    "transformers>=4.57,<5",
    "accelerate>=1.0,<2",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error:FutureWarning"]
