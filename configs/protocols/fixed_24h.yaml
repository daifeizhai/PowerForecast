# OPTIONAL historical preset A (task book §6.2): fixed 24h-ahead origins.
#
# Only applied when a run explicitly selects this file. It is configuration data, not a
# default of the generic engine: the time engine must keep working for any other history
# length / horizon / origin list without touching code.
#
# Origin of trace day k = first slot of day k+1; labels are the next 96 points (one full
# trace day), so the configured test origins produce label days shifted by exactly one day.

protocol_id: fixed_24h
frequency: 15min
points_per_day: 96
trace_anchor_policy: dataset_explicit
context_points: 1344

horizons:
  24h: 96

origin_mode: explicit
development_origins: [14, 16, 18, 20]
test_origins: [22, 23, 24, 25, 26, 27, 28, 29, 30]
smoke_origins: []

# LightGBM-style per-stage fitting cutoffs recorded as configuration data only. The time
# engine preserves these values verbatim in manifests; it never rewrites or enforces them
# for another model.
train_cutoffs:
  development: 14
  final: 22

availability_policy: strict
protocol_type: fixed_24h
default_horizon: 24h
overlap_warning: false
