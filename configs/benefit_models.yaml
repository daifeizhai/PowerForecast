default_models: [seasonal_naive, three_day_mean, ridge, normalized_ridge, uniform_transfer, fixed_blend, sapf_similarity, sapf, sapf_gain, sapf_gain_no_veto]
ridge: &ridge {alpha: 100.0, solver: auto, feature_mode: observed_history}
sapf:
  base_model: ridge
  base_params: *ridge
  scale_fraction: 0.01
  epsilon: 1.0e-6
  top_k: [1, 3, 7]
  temperatures: [0.5, 1.0, 2.0]
  feature_groups: [shape, level_shape]
  transfer_strengths: [0.0, 0.25, 0.5, 0.75, 1.0]
  reliability_powers: [0.0, 1.0]
  worst_domain_penalty: 0.1
  mape_threshold: 1.0e-8
benefit:
  n_estimators: 128
  max_depth: 6
  min_samples_leaf: 20
  n_jobs: 1
policy_grid:
  minimum_gain_pp: [0.0, 0.5, 1.0]
  maximum_negative_risk: [0.25, 0.5, 0.75, 1.0]
  strengths: [0.25, 0.5, 1.0]
  top_k: [1, 3]
  worst_domain_penalty: 0.1
fixed_blend_strength: 0.5
