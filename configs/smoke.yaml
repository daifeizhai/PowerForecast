# Smoke configuration: synthetic data only, engineering validation only.
#
# Used by the four commands in the task book:
#   python -m scripts.run_experiment --config configs/smoke.yaml --demo --horizon 24h
#   python -m scripts.run_experiment --config configs/smoke.yaml --demo --horizon 7d
#   ... --horizon 24h --protocol configs/protocols/fixed_24h.yaml
#   ... --horizon 7d  --protocol configs/protocols/fixed_7d.yaml
#
# The output is always tagged synthetic=true / research_result=false and can never
# be mistaken for a real facility-kW research result.

inherit: configs/base.yaml

experiment_id: smoke_synthetic
protocol_type: demo
model: seasonal_naive
seed: 7

dataset:
  days: 31
  noise: 1.0
  covariates: true
  missing_days: []

evaluation:
  mape_relative_threshold: 0.0
  prediction_batch_size: 64
  clip_min: null
  standardise_within_window: false

policy:
  demo_only: true
  require_real_facility_kw: false
  research_result: false
