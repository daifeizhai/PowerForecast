# SAPF main-line defaults. Historical 18-model/HDSF presets are frozen in archive/.
default_models: [seasonal_naive, three_day_mean, ridge, normalized_ridge, sapf_similarity, sapf]
models:
  naive: {}
  seasonal_naive: {period: 96}
  three_day_mean: {}
  seasonal_ar: {}
  ridge: &ridge {alpha: 100.0, solver: auto, feature_mode: observed_history}
  extra_trees: {n_estimators: 100, max_depth: 12, max_features: sqrt, n_jobs: 2, feature_mode: observed_history}
  lightgbm: {n_estimators: 100, num_leaves: 15, verbosity: -1, n_jobs: 2, output_jobs: 4, feature_mode: observed_history}
  xgboost: {n_estimators: 100, max_depth: 4, n_jobs: 2, tree_method: hist, output_jobs: 4, feature_mode: observed_history}
  sarima: {order: [1, 0, 1], seasonal_order: [1, 0, 0, 96], fit_points: 2048, maxiter: 50}
  lstm: {hidden_size: 32, epochs: 10, batch_size: 32, learning_rate: 0.001}
  tcn: {hidden_size: 32, epochs: 10, batch_size: 32, learning_rate: 0.001}
  dlinear: {epochs: 10, batch_size: 32, learning_rate: 0.001, kernel_size: 25}
  normalized_ridge:
    base_model: ridge
    base_params: *ridge
    scale_fraction: 0.01
    epsilon: 1.0e-6
  normalized_extra_trees:
    base_model: extra_trees
    base_params: {n_estimators: 100, max_depth: 12, max_features: sqrt, n_jobs: 2}
    scale_fraction: 0.01
    epsilon: 1.0e-6
  sapf_similarity: &sapf
    base_model: ridge
    base_params: *ridge
    scale_fraction: 0.01
    epsilon: 1.0e-6
    top_k: [1, 3, 7]
    temperatures: [0.5, 1.0, 2.0]
    feature_groups: [shape, level_shape]
    transfer_strengths: [0.0, 0.25, 0.5, 0.75, 1.0]
    reliability_powers: [0.0, 1.0]
    worst_domain_penalty: 0.1
    mape_threshold: 1.0e-8
  sapf: *sapf
