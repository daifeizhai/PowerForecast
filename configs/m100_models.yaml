# Fixed before the first M100 forecasting run. Same Ridge and SAPF grid as Google.
default_models: [seasonal_naive, three_day_mean, ridge, normalized_ridge, sapf_similarity, sapf, sapf_no_normalization, sapf_no_selection, sapf_no_fallback, sapf_no_reliability]
models:
  seasonal_naive: {period: 96}
  three_day_mean: {}
  ridge: &ridge {alpha: 100.0, solver: auto, feature_mode: observed_history}
  normalized_ridge:
    base_model: ridge
    base_params: *ridge
    scale_fraction: 0.01
    epsilon: 1.0e-6
  sapf_similarity: &sapf
    base_model: ridge
    base_params: *ridge
    scale_fraction: 0.01
    epsilon: 1.0e-6
    top_k: [1, 3, 7]
    temperatures: [0.5, 1.0, 2.0]
    feature_groups: [shape, level_shape]
    transfer_strengths: [0.0, 0.25, 0.5, 0.75, 1.0]
    reliability_powers: [0.0, 1.0]
    worst_domain_penalty: 0.1
    mape_threshold: 1.0e-8
  sapf: *sapf
  sapf_no_normalization: {}
  sapf_no_selection: {}
  sapf_no_fallback: {}
  sapf_no_reliability: {}
