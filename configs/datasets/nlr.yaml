name: nlr
# Raw files have naive timestamps. UTC is an explicit provisional assumption;
# the source catalog does not state a timezone. Verify before publication.
timezone: UTC
timezone_verified: false
frequency: 15min
target: facility_power_kw
target_unit: kW
domain_metadata:
  dataset_id: nlr_esif_pue
  site_id: esif
  domain_id: esif_supplied_components
  target_field: facility_power_kw
  target_kind: active_power
  target_scope: facility
  target_unit: kW
  label_origin: component_sum
  mapping_route: C
  timezone: UTC
  timezone_verified: false
  raw_frequency: 1min
  sampling_semantics: sample_mean
  interval_definition: 'start; [timestamp, timestamp + 15 minutes)'
  coverage: 'IT + cooling + HVAC + plug/light + pump; complete supplied components required per interval. Exhaustiveness and nonoverlap against an independent facility meter are unverified.'
  source_version: ESIF combined parquet files
  assumptions: ['Naive source ts provisionally interpreted as UTC.', 'Nominal minute sampling has jitter and variable interval counts; finite-sample means are not a verified continuous integral.', 'Not an independent facility total meter.']
  feature_availability: {target: history_only, it_power_kw: history_only, cooling_kw: history_only, hvac_kw: history_only, pump_kw: history_only, temperature_c: history_only, humidity_pct: history_only, calendar: future_known}
primary_source: power
# Keep the previous prepared data available to historical experiment records.
processed_path: data/processed/nlr_esif_combined.parquet
sources:
  power:
    path: data/raw/NLR_Dataset/esif.influx.buildingData.PUE.combined.parquet
    fallback_paths:
      - data/raw/nlr/esif.influx.buildingData.PUE.combined.parquet
      - NLR_Dataset/esif.influx.buildingData.PUE.combined.parquet
    timestamp: ts
    minimum_timestamp: '2015-01-01'
    columns:
      it_power_kw: it_power_kw
      cooling_kw: cooling_kw
      hvac_kw: hvac_kw
      plug_and_light_kw: plug_and_light_kw
      pump_kw: pump_kw
  weather:
    path: data/raw/NLR_Dataset/esif.influx.buildingData.outside.combined.parquet
    fallback_paths:
      - data/raw/nlr/esif.influx.buildingData.outside.combined.parquet
      - NLR_Dataset/esif.influx.buildingData.outside.combined.parquet
    timestamp: ts
    # Drop the sentinel 1970 row before resampling.
    minimum_timestamp: '2015-01-01'
    columns:
      temperature_c: outdoor_air_temp
      humidity_pct: outdoor_air_humidity
    # The official catalog specifies degrees Fahrenheit for temperature.
    scales: {temperature_c: 0.5555555555555556}
    offsets: {temperature_c: -17.77777777777778}
# An aggregate of the supplied components, not a directly measured total.
derived_columns:
  facility_power_kw:
    sum: [it_power_kw, cooling_kw, hvac_kw, plug_and_light_kw, pump_kw]
history_covariates: [it_power_kw, cooling_kw, hvac_kw, pump_kw, temperature_c, humidity_pct]
cleaning:
  ffill_limit: 4
  bounds:
    facility_power_kw: [0, null]
    it_power_kw: [0, null]
    cooling_kw: [0, null]
    hvac_kw: [0, null]
    plug_and_light_kw: [0, null]
    pump_kw: [0, null]
    temperature_c: [-60, 60]
    humidity_pct: [0, 100]
