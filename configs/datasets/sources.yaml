# ---------------------------------------------------------------------------
# Candidate source: Alibaba GPU v2020 (registered, NOT ingested)
# ---------------------------------------------------------------------------
alibaba_gpu_v2020:
  enabled: false
  dataset_id: alibaba_gpu_v2020
  display_name: "Alibaba Cluster Trace GPU v2020"
  site_id: alibaba
  role: candidate
  native_frequency: null
  timezone: null
  timezone_verified: false
  audit_status: unverified
  status: not_ingested
  directory: data/raw/Alibaba-GPU-v2020
  files:
    - pai_machine_metric.csv
    - pai_machine_spec.csv
    - pai_instance_table.csv
    - pai_job_table.csv
    - pai_task_table.csv
    - pai_sensor_table.csv
    - pai_group_tag_table.csv
  reasons:
    - >-
      `pai_machine_metric.csv` in this local copy is headerless (first line starts with a
      machine-id hash and no column names), so the metric columns cannot be mapped to
      audited semantic fields without the official schema.
    - >-
      The remaining tables are event/job/instance/sensor tables in long, per-event form;
      they are not aggregated to a continuous 15-minute series in this round.
    - >-
      Task book section 3.3: when a source cannot be reliably converted to 15-minute
      features, keep the raw events + field notes and mark the aggregation as incomplete.
      No continuous series may be fabricated, so this source is registered but not processed.
  training_approval:
    approved: false
    reason: >-
      Not ingested and not audited: no field schema, no native-frequency audit, no aggregated
      series. It stays a candidate for a later Stage-3 round.

# ---------------------------------------------------------------------------
# Target-domain reference facts (documented only; target-power owns the files)
# ---------------------------------------------------------------------------
# These facts let Stage 1 align source fields against the target domain without
# importing any target pipeline. They are NOT a target data adapter. The
# authoritative processed target files and their metadata are owned by the
# `target-power` teammate (data/processed/nlr*.parquet).
target_reference:
  dataset_id: nlr_esif
  display_name: "NLR ESIF building-data power + outdoor weather"
  site_id: nlr_esif
  domain_id: nlr_esif_combined
  role: target_supervised
  native_frequency: 15min
  timezone: UTC
  timezone_verified: false
  audit_status: partial
  trace_anchor_timestamp: "2015-11-10T03:00:00+00:00"
  interval_semantics: >-
    timestamp = start of a 15-minute [t, t+15min) interval; the processed frame is on a
    contiguous 15-minute UTC grid.
  availability_semantics: >-
    Historical facility power and outdoor weather observations. The label is a component sum,
    available after the interval closes; no future-known field is declared.
  ownership_note: >-
    Documented reference facts only. target-power owns the authoritative processed target
    files and target metadata; Stage 1 changes neither of them.
  label:
    field: facility_derived_kw
    target_kind: active_power
    target_scope: facility
    target_unit: kW
    label_origin: component_sum
    label_type: facility_derived_kw
    measurement_boundary: >-
      Sum of five audited facility sub-meter components (it, cooling, hvac, plug_and_light,
      pump). This is a derived facility value, not an independent facility total meter.
    sampling_semantics: "15-minute interval means, summed component-wise; timezone unverified"
    synthetic: false
    composition_fields:
      - it_power_kw
      - cooling_kw
      - hvac_kw
      - plug_and_light_kw
      - pump_kw
    composition_policy: >-
      The five component columns compose the label. They are NOT candidate model inputs and
      must never be used as future-known features to claim an independent operational-metric
      mapping (task book section 3.5). They are registered as label semantics only.
  features:
    - canonical_name: site_outdoor_temperature_c
      raw_name: temperature_c
      unit: "°C"
      semantic_type: temperature
      statistic: interval_mean
      aggregation_rule: native_kept
      availability: historical_observed
      physical_range: [-60, 60]
      measurement_point: "outdoor weather station at the facility site"
      notes: >-
        Outdoor weather at the site, NOT the node chassis ambient/inlet temperature measured
        by M100; the different measurement point forbids merging the two temperature fields.
    - canonical_name: site_outdoor_humidity_pct
      raw_name: humidity_pct
      unit: "%"
      semantic_type: other
      statistic: interval_mean
      aggregation_rule: native_kept
      availability: historical_observed
      physical_range: [0, 100]
      measurement_point: "outdoor weather station at the facility site"
      notes: "Outdoor relative humidity at the site; no comparable source-domain humidity field is registered."

# ---------------------------------------------------------------------------
# Field-registry / fusion semantics (task book sections 3.4 and 8.2)
# ---------------------------------------------------------------------------
field_registry:
  output: configs/datasets/feature_registry.yaml
  target_only:
    future_mapping:
      local_weight: 1.0
      global_fusion_weight: null
      status: semantic_reservation_only
    execution_note: >-
      `local_weight: 1.0` is a Stage-4 semantic reservation for target-only fields in their own
      local branch ("do not additionally suppress"), NOT a physical coefficient and NOT a share
      of the final prediction. Stages 1 and 2 must not execute any mapping and must not feed
      target-only fields into the Stage-2 main model A.
  global_fusion_weight: null
  global_fusion_status: unresolved
  approval:
    approved_for_stage1_analysis: true
    approved_for_pretraining: false
    approved_for_facility_kw_training: false
    reason: >-
      Stage 1 is analysis/preprocessing only. M100 and UCC audits are partial/unverified, so no
      source-domain dataset is approved for training in this round.

# ---------------------------------------------------------------------------
# Analysis defaults for scripts/analyze_sources.py (real-data figures only)
# ---------------------------------------------------------------------------
analysis:
  seed: 0
  distribution_sample_rows_per_feature: 50000
  # Window chosen inside node 10's longest gap-free observed run (2021-11-04 .. 2022-03-28)
  # so figures show real dynamics instead of a multi-week telemetry gap.
  example_domain: m100_node_10
  timeseries_start: "2021-11-10T00:00:00+00:00"
  timeseries_end: "2021-11-24T00:00:00+00:00"
  periodicity_start: "2021-11-10T00:00:00+00:00"
  periodicity_end: "2021-12-10T00:00:00+00:00"
  periodicity_max_lag: 672
  periodicity_features:
    - node_total_power_w
    - gpu0_core_temp_c
    - node_ambient_temp_c
